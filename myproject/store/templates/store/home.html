
 

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Getting The Best Product There</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}
header {
    background: #222;
    color: white;
    padding: 20px;
    text-align: center;
}
.search-box {
    margin-top: 15px;
    display: flex;
    justify-content: center;
    gap: 12px;
}
.search-box input {
    width: 55%;
    padding: 14px;
    font-size: 18px;
    border-radius: 8px;
    border: none;
}
.search-btn {
    padding: 16px 30px;
    font-size: 18px;
    background: #ff6600;
    border: none;
    color: white;
    border-radius: 8px;
    cursor: pointer;
}
.container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
    padding: 20px;
}
.card {
    background: white;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    padding: 10px;
    text-align: center;
}
.card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
}
.price {
    color: green;
    font-weight: bold;
}
a {
    text-decoration: none;
    color: inherit;
}
</style>
</head>

<body>

<header>
    <h1>Getting The Best Product There</h1>

<form method="get" action="{% url 'search_results' %}" class="search-box">
    <input
        type="text"
        name="q"
        placeholder="Search products..."
        required
    >
    <button class="search-btn" type="submit">Search</button>
</form>
<div class="container">
{% for product in products %}
<a href="{% url 'product_detail' product.id %}">
    <div class="card">
        {% if product.image %}
            <img src="{{ product.image.url }}">
        {% endif %}
        <h3>{{ product.name }}</h3>
        <p class="price">₹{{ product.price }}</p>
    </div>
</a>
{% empty %}
<p>No products available</p>
{% endfor %}
</div>

</body>
</html>
